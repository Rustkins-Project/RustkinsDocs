# Vérification documentaire locale avant chaque commit.
# Les tests Python et le contrôle historique des IDs restent obligatoires dans la CI.
repos:
  - repo: local
    hooks:
      - id: rustkins-docs-validation
        name: RustkinsDocs - validation documentaire
        entry: python scripts/validate_docs.py
        language: python
        additional_dependencies:
          - "PyYAML>=6.0,<7"
          - "jsonschema>=4.23,<5"
          - "markdown-it-py>=3.0,<5"
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        verbose: true
